<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Souvenue · Keep the night alive</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Hanken+Grotesk:wght@400..700&display=swap"><link rel="stylesheet" href="/style.css"></head><body><script>if(location.pathname==='/')document.body.classList.add('souvenue-home')</script><header><a class="brand" href="/">souvenue<span><img class="souvenue-logo" src="/souvenue-wordmark-art.svg" alt="" aria-hidden="true" width="52" height="43"></span></a><nav id="site-nav" aria-label="Main"><a href="/artists">Artists</a><a href="/feed">Photo feed</a><a href="/friends">Find friends</a><a href="/communities">Communities</a><a href="/leaderboards">Leaderboards</a><a href="/profile">My profile</a></nav><button id="account">Sign in</button><script>try{const n=localStorage.getItem('souvenue-account');if(n)document.querySelector('#account').textContent=n+' · Sign out'}catch(e){}</script><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu"><span></span><span></span></button></header><main id="app"></main><div id="toast" role="status"></div><dialog id="auth"><form id="authform"><button type="button" class="close" aria-label="Close">×</button><h2>Make yourself at home.</h2><p>Sign in to share your night. If you arrived by NFC tap, your show’s chat unlocks automatically.</p><label>Display name<input name="name" required minlength="2" maxlength="40" autocomplete="username"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="current-password"></label><p id="autherror" role="alert"></p><button name="action" value="login">Sign in</button><button name="action" value="register" class="secondary">Create account</button><small>Local accounts only. Please use a new password you don’t use elsewhere.</small></form></dialog><script src="/app.js" defer></script></body></html>
